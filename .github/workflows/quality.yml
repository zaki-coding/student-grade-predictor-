name: Quality and reproducibility
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Cold-checkout full suite (no generated models or research dataset)
        run: python -m pytest
      - name: Reproduce the research experiment separately
        run: python -m src.train
      - run: python -m compileall -q src app
      - run: python -m pip check
