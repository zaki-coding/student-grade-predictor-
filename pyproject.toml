[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "student-success-ai"
version = "3.0.0"
description = "A Streamlit app for tracking grades, planning coursework, and exploring grade predictions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "scikit-learn==1.8.0",
  "joblib>=1.4,<2",
  "streamlit>=1.50,<2",
  "plotly>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --basetemp=.pytest_tmp"
markers = ["integration: requires locally trained artifacts"]
